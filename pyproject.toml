[project]
name = "ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ambali Mustapha", email = "ambalimustapha.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.80",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "openai>=3.2.0",
    "python-dotenv>=1.2.3",
    "werkzeug>=3.1.8",
]

[project.scripts]
ai-backend = "ai_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
