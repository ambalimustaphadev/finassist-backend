[project]
name = "ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ambali Mustapha", email = "ambalimustapha.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.80",
    "firebase-admin>=7.6.0",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "openai>=3.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "werkzeug>=3.1.8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# This is a Flask application (run via server.create_app()/app.py),
# not a library meant to be built/installed as a package — the
# src/ai_backend/ scaffold and its [project.scripts] entry point were
# uv-init boilerplate with zero references anywhere in the app. `uv`
# is told not to build/install this project itself, only manage its
# dependencies.
[tool.uv]
package = false
